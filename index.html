<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3Lang 図書館 (完成版)</title>
    <script src="https://aka.ms/csspeech/jsbrowserpackageraw"></script>
    <script type="text/javascript" src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <style>
        :root {
            --bg: linear-gradient(165deg, #fff9e6 0%, #ffe8f0 100%);
            --title-bg: #ff8fab; --title-shadow: #e85d8a; --card: #ffffff;
            --tab-inactive: #ffe4ec; --tab-active-ja: #ff6b9d; --tab-active-zh: #ff9f43; --tab-active-en: #54a0ff;
            --text: #3d3d5c; --muted: #6b6b8a; --passage-bg: #fffef8;
            --border: #ffd6e8; --success: #2ecc71; --danger: #e74c3c; --accent: #ff8fab;
        }
        * { box-sizing: border-box; }
        body { font-family: 'M PLUS Rounded 1c', 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; min-height: 100vh; }
        .hidden { display: none !important; }
        
        .login-header { text-align: right; padding-bottom: 10px; }
        h1 { background: var(--title-bg); color: white; text-align: center; padding: 15px; border-radius: 15px; box-shadow: 0 4px 0 var(--title-shadow); margin-bottom: 30px; font-size: 1.5rem; }
        
        .library-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; padding: 10px; }
        .book-card { background: var(--card); border-radius: 20px; padding: 25px 15px; text-align: center; cursor: pointer; transition: 0.3s; border: 2px solid var(--border); box-shadow: 0 4px 10px rgba(255,143,171,0.1); }
        .book-card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(255,143,171,0.2); }
        .book-icon { font-size: 50px; display: block; margin-bottom: 15px; }
        .level-card { background: #fff; border: 3px solid #ffb8c6; }
        .level-card:hover { border-color: var(--title-bg); }

        .container { max-width: 700px; margin: 0 auto; background: var(--card); border-radius: 20px; padding: 25px; box-shadow: 0 10px 25px rgba(255,143,171,0.15); }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 12px; cursor: pointer; background: var(--tab-inactive); font-weight: bold; font-size: 1.1rem; color: var(--text); transition: 0.2s; }
        .tab-btn.active { background: var(--title-bg); color: white; }
        .lang-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .lang-btn { flex: 1; padding: 10px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 1rem; color: white; opacity: 0.5; transition: 0.2s; }
        #btn-ja { background: var(--tab-active-ja); } #btn-zh { background: var(--tab-active-zh); } #btn-en { background: var(--tab-active-en); }
        .lang-btn.active { opacity: 1; box-shadow: 0 4px 0 rgba(0,0,0,0.1); transform: translateY(-2px); }
        .passage-area { background: var(--passage-bg); padding: 25px; border-radius: 15px; border: 2px dashed var(--border); line-height: 2.2; font-size: 1.2rem; margin-bottom: 20px; position: relative; }
        ruby rt { font-size: 0.55em; color: var(--muted); font-weight: normal; }
        .tts-btn { background: #fff; border: 2px solid var(--accent); color: var(--accent); padding: 5px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; display: inline-flex; align-items: center; gap: 5px; transition: 0.2s; }
        .tts-btn:hover { background: var(--accent); color: white; }
        
        .question-box { background: #f8f9fa; padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #eee; }
        .quiz-item { margin-bottom: 15px; border-bottom: 1px dashed #ccc; padding-bottom: 15px; }
        .quiz-item:last-child { border-bottom: none; padding-bottom: 0; margin-bottom: 0; }
        .quiz-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .choice-btn {
            padding: 12px; border: 2px solid var(--border); border-radius: 10px;
            cursor: pointer; background: #fff; color: var(--text); font-weight: bold;
            font-size: 1rem; line-height: 1.4; min-height: 48px; transition: 0.2s;
        }
        .choice-btn:hover:not(:disabled) {
            background: #fff0f5; border-color: var(--title-bg);
            transform: translateY(-2px); box-shadow: 0 4px 8px rgba(255, 143, 171, 0.25);
        }
        .choice-btn:active:not(:disabled) { transform: translateY(0); }
        .choice-btn:disabled { opacity: 0.7; cursor: default; transform: none; box-shadow: none; }
        .choice-btn.correct-pick { background: #d4edda; border-color: var(--success); color: #1e6b3a; }
        .choice-btn.wrong-pick { background: #ffeaea; border-color: var(--danger); color: #c0392b; }
        
        .score-card { background: #e8f5e9; border: 2px solid var(--success); border-radius: 15px; padding: 20px; margin-top: 15px; }
        .score-correct-text { background: #fff; padding: 10px; border-radius: 10px; margin-bottom: 10px; font-size: 0.9rem; color: #555; }
        .score-recognized-text { margin: 0 0 15px 0; font-size: 1.1rem; color: #2d3436; border-bottom: 2px dashed #ccc; padding-bottom:10px; font-weight:bold;}
        .score-header { text-align: center; font-weight: bold; margin-bottom: 15px; color: var(--success); }
        .score-header span { font-size: 3rem; font-weight: 900; }
        .score-grid { display: flex; justify-content: space-around; text-align: center; }
        .score-item { font-size: 0.9rem; font-weight: bold; color: #555;}
        .score-item span { display: block; font-size: 1.8rem; color: var(--title-bg); font-weight: 900; margin-top: 5px;}
        
        .mic-section { margin-top: 20px; text-align: center; padding-top: 20px; border-top: 2px dashed #eee; }
        .mic-start-btn { width: 100%; padding: 15px; border-radius: 50px; border: none; background: #00d2d3; color: white; cursor: pointer; font-size: 1.1rem; font-weight: bold; box-shadow: 0 4px 0 #01a3a4; margin-bottom: 10px;}
        .mic-start-btn.recording { background: var(--danger); box-shadow: 0 4px 0 #c0392b; }
        .mic-start-btn.processing { background: #f39c12; box-shadow: 0 4px 0 #d68910; }
        .ai-advice-box { margin-top: 15px; background: #f0f7ff; padding: 20px; border-radius: 15px; text-align: left; border-left: 6px solid var(--accent); line-height: 1.6; }
        
        .vocab-list { display: flex; flex-direction: column; gap: 20px; }
        .vocab-card { border: 2px solid var(--border); border-radius: 15px; padding: 20px; display: flex; flex-direction: column; gap: 15px; background: #fff; margin-bottom: 20px;}
        .vocab-top { display: flex; align-items: center; gap: 15px; }
        .vocab-inputs { flex: 1; display: grid; gap: 12px; }
        .vocab-row { display: flex; gap: 8px; align-items: flex-start; }
        .vocab-row input { width: 100%; padding: 10px; border: 2px solid #eee; border-radius: 8px; font-size: 1rem; }
        .hint-btn { background: #f1f2f6; color: #576574; border: none; border-radius: 8px; padding: 8px 10px; cursor: pointer; font-size: 0.8rem; font-weight: bold;}
        .check-btn { background: var(--title-bg); color: white; border: none; border-radius: 8px; padding: 10px 15px; cursor: pointer; font-weight: bold; height: 42px;}
        .vocab-result { background: #fafafa; border-radius: 10px; padding: 15px; border-left: 4px solid var(--success); display: flex; flex-direction: column; gap: 10px;}
        
        .match-columns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        @media (max-width: 700px) { .match-columns { grid-template-columns: 1fr; } }
        .match-col { background: #fafafa; border-radius: 16px; padding: 12px; border: 2px solid var(--border); }
        .match-col-title { text-align: center; font-weight: bold; margin-bottom: 10px; padding: 8px; border-radius: 10px; color: white; }
        .match-col-title.col-ja { background: var(--tab-active-ja); }
        .match-col-title.col-zh { background: var(--tab-active-zh); }
        .match-col-title.col-en { background: var(--tab-active-en); }
        .match-word-row { display: flex; align-items: flex-start; gap: 6px; margin-bottom: 8px; }
        .match-word-btn {
            flex: 1; padding: 10px; border: 2px solid var(--border); border-radius: 12px;
            background: #fff; cursor: pointer; text-align: left; transition: 0.2s; line-height: 1.4;
        }
        .match-word-btn.selected { border-color: #f39c12; background: #fff8e6; box-shadow: 0 0 0 3px rgba(243,156,18,0.25); }
        .match-word-btn.matched { background: #d4edda !important; border-color: var(--success) !important; pointer-events: none; opacity: 0.9; }
        .match-word-btn.shake-wrong { animation: shakeWrong 0.5s; background: #ffeaea !important; border-color: var(--danger) !important; }
        @keyframes shakeWrong {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
        .match-progress { text-align: center; margin-top: 16px; font-weight: bold; color: var(--title-bg); }
        .story-nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 24px; padding-top: 20px; border-top: 3px dashed var(--border); }
        .nav-story-btn {
            flex: 1; padding: 14px 20px; border: none; border-radius: 50px; font-size: 1.05rem; font-weight: bold;
            cursor: pointer; background: var(--title-bg); color: white; box-shadow: 0 4px 0 var(--title-shadow); transition: 0.2s;
        }
        .nav-story-btn:hover:not(:disabled) { transform: translateY(-2px); }
        .nav-story-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; background: #ccc; }
        #story-nav-label { font-weight: bold; color: var(--muted); white-space: nowrap; }

        #please-login-view { text-align: center; margin-top: 50px; background: var(--card); padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(255,143,171,0.15); max-width: 500px; margin-left: auto; margin-right: auto; }
        .back-btn { padding:10px 20px; border-radius:20px; border:none; background:#fff; font-weight:bold; cursor:pointer; box-shadow:0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; display: inline-block; }
        .back-btn:hover { background: #f8f9fa; }
    </style>
</head>
<body>

    <div class="login-header">
        <div data-netlify-identity-menu></div>
    </div>

    <div id="please-login-view">
        <h2>🔒 ログインしてください</h2>
        <p>右上のボタンからログインしてください。</p>
    </div>

    <div id="level-selection-view" class="hidden">
        <h1>🌱 3Lang としょかん - レベルをえらぼう</h1>
        <div class="library-grid" id="level-list"></div>
    </div>

    <div id="library-view" class="hidden">
        <button class="back-btn" onclick="showLevelSelection()">← レベルえらびに もどる</button>
        <h1 id="library-title">🌱 としょかん</h1>
        <div class="library-grid" id="book-list"></div>
    </div>

    <div id="study-view" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <button class="back-btn" onclick="showLibrary()" style="margin-bottom:0;">← ほんだなに もどる</button>
            <select id="global-tts-rate" style="padding:8px; border-radius:10px; border:2px solid var(--border);">
                <option value="0.8">0.8x</option>
                <option value="1.0" selected>1.0x</option>
                <option value="1.2">1.2x</option>
            </select>
        </div>
        
        <div class="container">
            <h2 id="book-title" style="text-align: center; color: var(--title-bg);"></h2>
            <div class="tabs">
                <button class="tab-btn active" id="tab-read" onclick="switchMode('read')">📖 よむ</button>
                <button class="tab-btn" id="tab-vocab" onclick="switchMode('vocab')">📝 たんご</button>
            </div>

            <div id="mode-read">
                <div class="lang-tabs">
                    <button id="btn-ja" class="lang-btn active" onclick="setLang('ja')">日本語</button>
                    <button id="btn-zh" class="lang-btn" onclick="setLang('zh')">中国語</button>
                    <button id="btn-en" class="lang-btn" onclick="setLang('en')">English</button>
                </div>
                <div class="passage-area">
                    <div style="text-align: right;"><button class="tts-btn" onclick="playPassageTTS()">🔊 聞く</button></div>
                    <div id="passage-text"></div>
                </div>
                
                <div class="question-box" id="quiz-container"></div>

                <div class="mic-section">
                    <button id="main-mic-btn" class="mic-start-btn" onclick="toggleDynamicMic('main')">🎤 はつおんテスト</button>
                    <div id="main-score-area"></div>
                    <div id="main-advice-area" class="ai-advice-box hidden"></div>
                </div>
            </div>

            <div id="mode-vocab" class="hidden">
                <div id="vocab-container" class="vocab-list"></div>
            </div>

            <div id="story-nav" class="story-nav hidden">
                <button type="button" id="btn-prev-story" class="nav-story-btn" onclick="navigateStory(-1)">◀ 前の問題</button>
                <span id="story-nav-label"></span>
                <button type="button" id="btn-next-story" class="nav-story-btn" onclick="navigateStory(1)">次の問題 ▶</button>
            </div>
        </div>
    </div>

    <script>
        let booksData = []; 
        let levelFilteredBooks = [];
        let currentBook = null;
        let currentLevel = null;
        let currentIndex = 0;
        let currentLang = 'ja';
        let currentMode = 'read';
        let isRecording = false;
        window.quizMistakes = {};
        let matchSelection = [];
        let matchMatchedIds = new Set();

        function formatZhRuby(text) {
            if (!text) return "";
            return text.replace(/([\u4E00-\u9FA5]+)\s*[(（]([^)）]+)[)）]/g, '<ruby>$1<rt>$2</rt></ruby>');
        }

        function formatJaRuby(text) {
            if (!text) return "";
            return text.replace(/([一-龠ぁ-んァ-ヶ]+)\s*[(（]([^)）]+)[)）]/g, '<ruby>$1<rt>$2</rt></ruby>');
        }

        function formatLangContent(text, lang) {
            if (!text) return "";
            if (lang === 'ja') return formatJaRuby(text);
            if (lang === 'zh') return formatZhRuby(text);
            return escapeHtml(text);
        }

        const API_URL = "https://script.google.com/macros/s/AKfycbwcFerv_iV0HfB_5J7Swm0cd3AjWDuydsCVTRg7A2uVesMhsRAHFGbTltUNWOIE8jy2/exec";

        const levels = [
            { id: 1, name: "Level 1", grade: "1年生", icon: "🐣" },
            { id: 2, name: "Level 2", grade: "2年生", icon: "🐥" },
            { id: 3, name: "Level 3", grade: "3年生", icon: "🎒" },
            { id: 4, name: "Level 4", grade: "4年生", icon: "📚" },
            { id: 5, name: "Level 5", grade: "5年生", icon: "🔬" },
            { id: 6, name: "Level 6", grade: "6年生", icon: "🎓" }
        ];

        let activeRecognizer = null;
        let activeMicId = null;
        let activeFinalResult = null;
        let activeRecognizedText = "";
        let activeReferenceText = "";

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function stripTextForTTS(text) {
            return String(text || "")
                .replace(/<[^>]*>/g, '')
                .replace(/([一-龠]+)\([^)]+\)/g, '$1')
                .replace(/([\u4E00-\u9FA5，。！？、]+)\s*\([^)]+\)/g, '$1')
                .trim();
        }

        function shuffleArray(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function forceStopMic() {
            if(activeRecognizer) {
                try { activeRecognizer.stopContinuousRecognitionAsync(); activeRecognizer.close(); } catch(e){}
                activeRecognizer = null;
            }
            isRecording = false;
            activeMicId = null;
            
            document.querySelectorAll('.mic-start-btn').forEach(btn => {
                btn.className = "mic-start-btn";
                if (btn.id === 'main-mic-btn') {
                    btn.innerText = "🎤 はつおんテスト";
                } else {
                    btn.innerText = "🎤 再テスト";
                }
            });
            const mainScore = document.getElementById('main-score-area');
            const mainAdvice = document.getElementById('main-advice-area');
            if(mainScore) mainScore.innerHTML = "";
            if(mainAdvice) { mainAdvice.innerHTML = ""; mainAdvice.classList.add('hidden'); }
        }

        window.onload = () => {
            if (window.netlifyIdentity) {
                window.netlifyIdentity.on("init", user => checkLoginStatus(user));
                window.netlifyIdentity.on("login", user => { checkLoginStatus(user); window.netlifyIdentity.close(); });
                window.netlifyIdentity.on("logout", () => checkLoginStatus(null));
            }
        };

        async function checkLoginStatus(user) {
            try {
                if (user) {
                    document.getElementById('please-login-view').classList.add('hidden');
                    document.getElementById('level-selection-view').classList.remove('hidden');
                    
                    if (booksData.length === 0) {
                        document.getElementById('level-list').innerHTML = "<h3 style='grid-column: 1 / -1; text-align:center;'>📚 データを読み込み中...</h3>";
                        const res = await fetch(API_URL + "?t=" + new Date().getTime(), { cache: "no-store" });
                        const rawData = await res.json();
                        const validData = rawData.filter(r => r.id && r.titleJa);

                        booksData = validData.map(row => ({
                            grade: row.grade, id: row.id, category: row.category, title: row.titleJa, icon: '📖',
                            ja: { passage: row.textJaRuby || formatJaRuby(row.textJaPlain || ""), rawPassage: row.textJaPlain || row.textJaRuby || "" },
                            zh: { passage: formatZhRuby(row.textZhPinyin), rawPassage: row.textZhPinyin },
                            en: { passage: row.textEn, rawPassage: row.textEn },
                            vocab: typeof row.words === 'string' ? JSON.parse(row.words || "[]") : (row.words || []),
                            q1: {
                                ja: { q: row.q1_ja || "", a: row.a1_ja || "", h: row.h1_ja || "", w1: row.q1_wrong1_ja || "", w2: row.q1_wrong2_ja || "", w3: row.q1_wrong3_ja || "" },
                                zh: { q: row.q1_zh || "", a: row.a1_zh || "", h: row.h1_zh || "", w1: row.q1_wrong1_zh || "", w2: row.q1_wrong2_zh || "", w3: row.q1_wrong3_zh || "" },
                                en: { q: row.q1_en || "", a: row.a1_en || "", h: row.h1_en || "", w1: row.q1_wrong1_en || "", w2: row.q1_wrong2_en || "", w3: row.q1_wrong3_en || "" }
                            },
                            q2: {
                                ja: { q: row.q2_ja || "", a: row.a2_ja || "", h: row.h2_ja || "", w1: row.q2_wrong1_ja || "", w2: row.q2_wrong2_ja || "", w3: row.q2_wrong3_ja || "" },
                                zh: { q: row.q2_zh || "", a: row.a2_zh || "", h: row.h2_zh || "", w1: row.q2_wrong1_zh || "", w2: row.q2_wrong2_zh || "", w3: row.q2_wrong3_zh || "" },
                                en: { q: row.q2_en || "", a: row.a2_en || "", h: row.h2_en || "", w1: row.q2_wrong1_en || "", w2: row.q2_wrong2_en || "", w3: row.q2_wrong3_en || "" }
                            },
                            q3: {
                                ja: { q: row.q3_ja || "", a: row.a3_ja || "", h: row.h3_ja || "", w1: row.q3_wrong1_ja || "", w2: row.q3_wrong2_ja || "", w3: row.q3_wrong3_ja || "" },
                                zh: { q: row.q3_zh || "", a: row.a3_zh || "", h: row.h3_zh || "", w1: row.q3_wrong1_zh || "", w2: row.q3_wrong2_zh || "", w3: row.q3_wrong3_zh || "" },
                                en: { q: row.q3_en || "", a: row.a3_en || "", h: row.h3_en || "", w1: row.q3_wrong1_en || "", w2: row.q3_wrong2_en || "", w3: row.q3_wrong3_en || "" }
                            }
                        }));
                        renderLevelCards(); 
                    } else { renderLevelCards(); }
                } else {
                    hideAllViews();
                    document.getElementById('please-login-view').classList.remove('hidden');
                }
            } catch (err) {
                document.getElementById('level-list').innerHTML = `<h3 style='grid-column: 1 / -1; color:red; text-align:center;'>読み込みエラー: ${err.message}</h3>`;
            }
        }

        function hideAllViews() {
            ['please-login-view', 'level-selection-view', 'library-view', 'study-view'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.add('hidden');
            });
            try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch(e) {}
            try { forceStopMic(); } catch(e) {}
        }

        function showLevelSelection() { hideAllViews(); document.getElementById('level-selection-view').classList.remove('hidden'); renderLevelCards(); }
        function showLibrary() { hideAllViews(); document.getElementById('library-view').classList.remove('hidden'); }

        function renderLevelCards() {
            const list = document.getElementById('level-list');
            list.innerHTML = "";
            levels.forEach(lvl => {
                const card = document.createElement('div');
                card.className = 'book-card level-card';
                card.innerHTML = `<span class="book-icon">${lvl.icon}</span><div style="font-weight:bold; font-size:1.2rem;">${lvl.name}</div><div style="font-size:0.9rem; color:var(--muted); margin-top:5px;">${lvl.grade}</div>`;
                card.onclick = () => openLibraryForLevel(lvl);
                list.appendChild(card);
            });
        }

        function openLibraryForLevel(lvl) {
            currentLevel = lvl;
            hideAllViews();
            document.getElementById('library-view').classList.remove('hidden');
            document.getElementById('library-title').innerText = `🌱 ${lvl.name} の としょかん`;

            const targetId = String(lvl.id);
            const fullWidthTarget = String.fromCharCode(targetId.charCodeAt(0) + 0xFEE0);
            const filteredBooks = booksData.filter(book => book && book.grade && (String(book.grade).includes(targetId) || String(book.grade).includes(fullWidthTarget)));
            
            const list = document.getElementById('book-list');
            list.innerHTML = "";
            if (filteredBooks.length === 0) {
                list.innerHTML = `<p style='grid-column: 1 / -1; text-align:center; padding:40px; font-weight:bold;'>まだ お話が ありません。</p>`;
                return;
            }

            levelFilteredBooks = filteredBooks;
            levelFilteredBooks.forEach((book, index) => {
                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `<span class="book-icon">${book.icon || '📖'}</span><div style="font-size:0.8rem; color:var(--muted); margin-bottom:5px;">[${book.category || '未分類'}]</div><div style="font-weight:bold; line-height:1.4;">${book.title || 'タイトルなし'}</div>`;
                card.onclick = () => { currentIndex = index; currentBook = book; startStudy(); };
                list.appendChild(card);
            });
        }

        function startStudy() {
            document.getElementById('book-title').innerText = currentBook.title;
            hideAllViews();
            document.getElementById('study-view').classList.remove('hidden');
            updateStoryNav();
            setLang('ja');
            if (currentMode === 'vocab') renderMatchGame();
        }

        function updateStoryNav() {
            const nav = document.getElementById('story-nav');
            const label = document.getElementById('story-nav-label');
            const prevBtn = document.getElementById('btn-prev-story');
            const nextBtn = document.getElementById('btn-next-story');
            if (!nav) return;
            const total = levelFilteredBooks.length;
            if (total <= 1) {
                nav.classList.add('hidden');
                return;
            }
            nav.classList.remove('hidden');
            if (label) label.textContent = (currentIndex + 1) + " / " + total;
            if (prevBtn) prevBtn.disabled = currentIndex <= 0;
            if (nextBtn) nextBtn.disabled = currentIndex >= total - 1;
        }

        function navigateStory(delta) {
            if (!levelFilteredBooks.length) return;
            const nextIndex = currentIndex + delta;
            if (nextIndex < 0 || nextIndex >= levelFilteredBooks.length) return;
            currentIndex = nextIndex;
            currentBook = levelFilteredBooks[currentIndex];
            forceStopMic();
            document.getElementById('book-title').innerText = currentBook.title;
            setLang(currentLang);
            if (currentMode === 'vocab') renderMatchGame();
            updateStoryNav();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('tab-read').classList.toggle('active', mode === 'read');
            document.getElementById('tab-vocab').classList.toggle('active', mode === 'vocab');
            document.getElementById('mode-read').classList.toggle('hidden', mode !== 'read');
            document.getElementById('mode-vocab').classList.toggle('hidden', mode !== 'vocab');
            if(mode === 'vocab') renderMatchGame();
        }

        function setLang(lang) {
            currentLang = lang;
            ['ja', 'zh', 'en'].forEach(l => document.getElementById(`btn-${l}`).classList.toggle('active', l === lang));
            document.getElementById('passage-text').innerHTML = currentBook[lang].passage || "";
            renderQuizzes(lang);
        }

        function renderQuizzes(lang) {
            const container = document.getElementById('quiz-container');
            if (!currentBook || !container) return;
            window.quizMistakes = {};
            const uiTexts = {
                ja: { title: "🎯 クイズにちょうせん！", q: "Q" },
                zh: { title: "🎯 挑战测验！", q: "问" },
                en: { title: "🎯 Quiz Time!", q: "Q" }
            };
            const ui = uiTexts[lang] || uiTexts.ja;
            container.innerHTML = "<h3 style='margin-top:0; color:var(--title-bg);'>" + ui.title + "</h3>";

            [1, 2, 3].forEach(qNum => {
                const qData = currentBook["q" + qNum] && currentBook["q" + qNum][lang];
                if (!qData || !qData.q) return;

                const choices = [
                    { text: qData.a, isCorrect: true },
                    { text: qData.w1, isCorrect: false },
                    { text: qData.w2, isCorrect: false },
                    { text: qData.w3, isCorrect: false }
                ].filter(c => c.text);
                shuffleArray(choices);

                const item = document.createElement("div");
                item.className = "quiz-item";
                item.style.cssText = "margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px dashed var(--border);";

                const qLine = document.createElement("p");
                qLine.style.cssText = "font-weight:bold; margin: 0 0 5px 0;";
                qLine.innerHTML = ui.q + qNum + ": " + formatLangContent(qData.q, lang);
                item.appendChild(qLine);

                const details = document.createElement("details");
                details.style.marginBottom = "10px";
                const summary = document.createElement("summary");
                summary.style.cssText = "cursor: pointer; font-weight: bold; color: var(--muted);";
                summary.textContent = "💡 ヒントを見る";
                const hintBody = document.createElement("div");
                hintBody.style.cssText = "margin-top: 5px; padding: 8px; background: #f0f8ff; border-radius: 5px; color: var(--text);";
                hintBody.innerHTML = formatLangContent(qData.h, lang);
                details.appendChild(summary);
                details.appendChild(hintBody);
                item.appendChild(details);

                const grid = document.createElement("div");
                grid.className = "quiz-choices";
                grid.style.marginTop = "10px";

                choices.forEach((choice, idx) => {
                    const btn = document.createElement("button");
                    btn.type = "button";
                    btn.id = "btn-" + qNum + "-" + idx;
                    btn.className = "choice-btn";
                    btn.innerHTML = formatLangContent(choice.text, lang);
                    btn.addEventListener("click", function() {
                        window.checkQuizAnswer(qNum, choice.isCorrect, qData.a || "", btn.id, lang);
                    });
                    grid.appendChild(btn);
                });
                item.appendChild(grid);

                const resDiv = document.createElement("div");
                resDiv.id = "res-" + qNum;
                resDiv.style.cssText = "margin-top:10px; font-weight:bold;";
                item.appendChild(resDiv);

                container.appendChild(item);
            });
        }

        window.checkQuizAnswer = function(qNum, isCorrect, correctText, btnId, lang) {
            const res = document.getElementById("res-" + qNum);
            const btn = document.getElementById(btnId);
            if (!res || !btn) return;

            const answeredCorrect = (isCorrect === true || isCorrect === "true");
            const msgs = {
                ja: { success: "🌟 大正解！", fail: "❌ おしい！", show: "❌ 3回間違えました。正解は「{ans}」です。" },
                zh: { success: "🌟 回答正确！", fail: "❌ 差不多！", show: "❌ 错了3次。正确答案是「{ans}」。" },
                en: { success: "🌟 Correct!", fail: "❌ Almost!", show: "❌ 3 mistakes. The answer is '{ans}'." }
            };
            const msg = msgs[lang] || msgs.ja;

            if (answeredCorrect) {
                res.innerHTML = "<span style=\"color:var(--success);\">" + msg.success + "</span>";
                btn.style.background = "#d1ffd1";
                btn.style.borderColor = "var(--success)";
                window.quizMistakes[qNum] = 0;
            } else {
                window.quizMistakes[qNum] = (window.quizMistakes[qNum] || 0) + 1;
                btn.style.background = "#ffd1d1";
                btn.style.borderColor = "var(--danger)";
                if (window.quizMistakes[qNum] >= 3) {
                    res.innerHTML = "<span style=\"color:var(--danger); font-weight:bold;\">" + msg.show.replace("{ans}", formatLangContent(correctText, lang)) + "</span>";
                } else {
                    res.innerHTML = "<span style=\"color:var(--danger);\">" + msg.fail + " (" + window.quizMistakes[qNum] + "/3)</span>";
                }
            }
        };

        let currentPlayingText = "";
        function playPassageTTS() {
            if(!currentBook) return;
            const text = stripTextForTTS(currentBook[currentLang].rawPassage || "");
            if(text) playTTS(text, currentLang);
        }

        function playTTS(text, lang) {
            if (window.speechSynthesis.speaking) {
                window.speechSynthesis.cancel();
                if (currentPlayingText === text) { currentPlayingText = ""; return; }
            }
            currentPlayingText = text;
            const ut = new SpeechSynthesisUtterance(text);
            ut.lang = lang === 'ja' ? 'ja-JP' : (lang === 'zh' ? 'zh-CN' : 'en-US');
            ut.rate = parseFloat(document.getElementById('global-tts-rate').value);
            ut.onend = () => { currentPlayingText = ""; };
            setTimeout(() => { window.speechSynthesis.speak(ut); }, 50);
        }

        function renderMatchGame() {
            const container = document.getElementById('vocab-container');
            if (!container) return;
            container.innerHTML = "";
            matchSelection = [];
            matchMatchedIds = new Set();

            if (!currentBook || !currentBook.vocab || currentBook.vocab.length === 0) {
                container.innerHTML = "<p style='text-align:center; color:var(--muted); font-weight:bold;'>このお話には単語がありません。</p>";
                return;
            }

            const words = currentBook.vocab.map((v, idx) => ({
                id: String(v.id != null ? v.id : idx),
                ja: v.ja || "",
                zh: v.zh || v.zh_pinyin || "",
                en: v.en || "",
                jaRaw: v.ja || "",
                zhRaw: v.zh || v.zh_pinyin || "",
                enRaw: v.en || ""
            }));

            const title = document.createElement("h3");
            title.style.cssText = "text-align:center; color:var(--title-bg); margin:0 0 16px 0;";
            title.textContent = "🔗 3言語マッチング";
            container.appendChild(title);

            const colsWrap = document.createElement("div");
            colsWrap.className = "match-columns";

            const colDefs = [
                { lang: "ja", title: "🇯🇵 日本語", cls: "col-ja" },
                { lang: "zh", title: "🇨🇳 中国語", cls: "col-zh" },
                { lang: "en", title: "🇺🇸 English", cls: "col-en" }
            ];

            colDefs.forEach(col => {
                const colEl = document.createElement("div");
                colEl.className = "match-col";
                const colTitle = document.createElement("div");
                colTitle.className = "match-col-title " + col.cls;
                colTitle.textContent = col.title;
                colEl.appendChild(colTitle);

                shuffleArray(words).forEach(w => {
                    if (matchMatchedIds.has(w.id)) return;
                    const label = col.lang === "ja" ? formatJaRuby(w.ja) :
                        col.lang === "zh" ? formatZhRuby(w.zh) : escapeHtml(w.en);
                    const ttsText = col.lang === "ja" ? w.jaRaw : col.lang === "zh" ? w.zhRaw : w.enRaw;
                    if (!ttsText) return;

                    const row = document.createElement("div");
                    row.className = "match-word-row";

                    const ttsBtn = document.createElement("button");
                    ttsBtn.type = "button";
                    ttsBtn.className = "tts-btn";
                    ttsBtn.style.padding = "5px 8px";
                    ttsBtn.textContent = "🔊";
                    ttsBtn.addEventListener("click", function(e) {
                        e.stopPropagation();
                        playTTS(stripTextForTTS(ttsText), col.lang);
                    });

                    const btn = document.createElement("button");
                    btn.type = "button";
                    btn.className = "match-word-btn";
                    btn.dataset.wordId = w.id;
                    btn.dataset.lang = col.lang;
                    btn.innerHTML = label;
                    btn.addEventListener("click", function() { onMatchWordClick(btn); });

                    row.appendChild(ttsBtn);
                    row.appendChild(btn);
                    colEl.appendChild(row);
                });
                colsWrap.appendChild(colEl);
            });

            container.appendChild(colsWrap);

            const progress = document.createElement("div");
            progress.className = "match-progress";
            progress.id = "match-progress";
            progress.textContent = "0 / " + words.length + " セット完成";
            container.appendChild(progress);
        }

        function updateMatchProgress(total) {
            const el = document.getElementById("match-progress");
            if (el) el.textContent = matchMatchedIds.size + " / " + total + " セット完成";
        }

        function clearMatchSelectionHighlight() {
            document.querySelectorAll(".match-word-btn.selected").forEach(b => b.classList.remove("selected"));
        }

        function resetMatchSelection() {
            matchSelection = [];
            clearMatchSelectionHighlight();
        }

        function onMatchWordClick(btn) {
            if (btn.classList.contains("matched")) return;
            const wordId = btn.dataset.wordId;
            const lang = btn.dataset.lang;
            if (matchMatchedIds.has(wordId)) return;

            const existingIdx = matchSelection.findIndex(s => s.lang === lang);
            if (existingIdx >= 0) {
                matchSelection[existingIdx].btn.classList.remove("selected");
                matchSelection.splice(existingIdx, 1);
            }

            btn.classList.add("selected");
            matchSelection.push({ wordId: wordId, lang: lang, btn: btn });

            if (matchSelection.length < 3) return;

            const ids = matchSelection.map(s => s.wordId);
            const langs = matchSelection.map(s => s.lang);
            const allSameId = ids.every(id => id === ids[0]);
            const allDifferentLang = new Set(langs).size === 3;

            if (allSameId && allDifferentLang) {
                matchMatchedIds.add(ids[0]);
                matchSelection.forEach(s => {
                    s.btn.classList.remove("selected");
                    s.btn.classList.add("matched");
                });
                resetMatchSelection();
                const total = (currentBook.vocab || []).length;
                updateMatchProgress(total);
                if (matchMatchedIds.size >= total) {
                    const prog = document.getElementById("match-progress");
                    if (prog) prog.textContent = "🎉 ぜんぶ マッチできました！";
                }
            } else {
                matchSelection.forEach(s => {
                    s.btn.classList.add("shake-wrong");
                    setTimeout(function() { s.btn.classList.remove("shake-wrong"); }, 500);
                });
                setTimeout(resetMatchSelection, 500);
            }
        }

        // ==========================================
        //  スピーキングテスト関連処理（Azure & Gemini）
        // ==========================================
        async function toggleDynamicMic(contextId, customText = null, customLang = null) {
            const btnId = contextId === 'main' ? 'main-mic-btn' : `btn-${contextId}`;
            const btn = document.getElementById(btnId);

            if (isRecording) {
                if (activeMicId === contextId) { stopMic(contextId); return; } 
                else { forceStopMic(); }
            }

            isRecording = true; activeMicId = contextId;
            activeFinalResult = null; activeRecognizedText = "";

            const targetLangCode = customLang || currentLang;
            activeReferenceText = (customText || currentBook[currentLang].rawPassage || "").replace(/<[^>]*>?/gm, '').trim();
            if (!activeReferenceText) {
                document.getElementById(`${contextId}-score-area`).innerHTML = "<div style='color:red;'>読み上げる文章がありません。</div>";
                isRecording = false; return;
            }

            let azureLang = targetLangCode === 'ja' ? 'ja-JP' : (targetLangCode === 'zh' ? 'zh-CN' : 'en-US');

            btn.className = "mic-start-btn recording"; btn.innerText = "⏹️ 停止して採点";
            document.getElementById(`${contextId}-score-area`).innerHTML = "⏳ じゅんびちゅう...";
            if(document.getElementById(`${contextId}-advice-area`)) document.getElementById(`${contextId}-advice-area`).classList.add('hidden');

            try {
                const res = await fetch('/.netlify/functions/api', { method: 'POST', body: JSON.stringify({ service: 'azure-token' }) });
                // ★ 404エラー（関数が見つからない）場合のエラー処理
                if (!res.ok) {
                    throw new Error("Netlify Functions が見つかりません。APIファイルが正しくアップロードされているか確認してください。");
                }
                const tokenData = await res.json();
                if(tokenData.error) throw new Error(tokenData.error);
                
                const speechConfig = SpeechSDK.SpeechConfig.fromAuthorizationToken(tokenData.token, tokenData.region);
                speechConfig.speechRecognitionLanguage = azureLang;
                const pronConfig = new SpeechSDK.PronunciationAssessmentConfig(activeReferenceText, SpeechSDK.PronunciationAssessmentGradingSystem.HundredMark, SpeechSDK.PronunciationAssessmentGranularity.Phoneme, true);
                
                activeRecognizer = new SpeechSDK.SpeechRecognizer(speechConfig, SpeechSDK.AudioConfig.fromDefaultMicrophoneInput());
                pronConfig.applyTo(activeRecognizer);
                
                activeRecognizer.recognized = (s, e) => {
                    if (e.result.reason === SpeechSDK.ResultReason.RecognizedSpeech) {
                        activeFinalResult = SpeechSDK.PronunciationAssessmentResult.fromResult(e.result);
                        activeRecognizedText += e.result.text + " ";
                    }
                };
                
                document.getElementById(`${contextId}-score-area`).innerHTML = "🎤 きいているよ... 大きな声で読んでね！";
                activeRecognizer.startContinuousRecognitionAsync();
            } catch (e) { 
                console.error(e);
                document.getElementById(`${contextId}-score-area`).innerHTML = `<div style='color:red;'>${e.message || "エラーが発生しました。"}</div>`;
                isRecording = false; btn.className = "mic-start-btn"; btn.innerText = "🎤 再テスト"; 
            }
        }

        function stopMic(contextId) {
            const btnId = contextId === 'main' ? 'main-mic-btn' : `btn-${contextId}`;
            const btn = document.getElementById(btnId);
            btn.className = "mic-start-btn processing"; btn.innerText = "⏳ けいさんちゅう...";

            setTimeout(() => {
                if (activeRecognizer) {
                    activeRecognizer.stopContinuousRecognitionAsync(() => {
                        activeRecognizer.close(); activeRecognizer = null; isRecording = false; activeMicId = null;
                        btn.className = "mic-start-btn"; 
                        btn.innerText = contextId === 'main' ? "🎤 はつおんテスト" : "🎤 再テスト";

                        if (activeFinalResult && activeRecognizedText.trim() !== "") {
                            drawScore(contextId, activeFinalResult, activeRecognizedText, activeReferenceText);
                            requestGemini(contextId, activeFinalResult, activeRecognizedText, activeReferenceText);
                        } else {
                            document.getElementById(`${contextId}-score-area`).innerHTML = "<div style='color:red;'>うまくききとれませんでした。</div>";
                        }
                    });
                }
            }, 1500); 
        }

        function drawScore(contextId, pronResult, recognizedText, correctText) {
            const scoreDiv = document.getElementById(`${contextId}-score-area`);
            const total = Math.round(pronResult.pronunciationScore) || 0;
            const accuracy = Math.round(pronResult.accuracyScore) || 0;
            const fluency = Math.round(pronResult.fluencyScore) || 0;
            const completeness = Math.round(pronResult.completenessScore) || 0;

            scoreDiv.innerHTML = `
                <div class="score-card">
                    <div class="score-correct-text"><strong>お手本：</strong> ${correctText}</div>
                    <div class="score-recognized-text"><strong>ききとった言葉：</strong><br>${recognizedText}</div>
                    <div class="score-header">総合スコア<br><span>${total}</span></div>
                    <div class="score-grid">
                        <div class="score-item">発音<span>${total}</span></div>
                        <div class="score-item">正確さ<span>${accuracy}</span></div>
                        <div class="score-item">流暢さ<span>${fluency}</span></div>
                        <div class="score-item">完全性<span>${completeness}</span></div>
                    </div>
                </div>
            `;
        }

        async function requestGemini(contextId, pronResult, recognizedText, refText) {
            const adviceDiv = document.getElementById(`${contextId}-advice-area`);
            if(!adviceDiv) return;
            adviceDiv.classList.remove('hidden'); adviceDiv.innerHTML = "🤖 先生が かんがえちゅう...";
            
            const targetLangCode = contextId.includes('-zh-') ? 'zh' : (contextId.includes('-en-') ? 'en' : currentLang);
            const promptText = `あなたは優しい小学校の先生です。以下の音声認識データをもとに、子供向けの発音アドバイスを日本語で100文字程度でしてください。対象言語: ${targetLangCode} / 読もうとした文章: ${refText} / 認識された音声: ${recognizedText} / 発音スコア: ${pronResult.pronunciationScore}`;
            
            try {
                const response = await fetch('/.netlify/functions/api', {
                    method: "POST",
                    body: JSON.stringify({ service: 'gemini', data: { contents: [{ parts: [{ text: promptText }] }] } })
                });
                const data = await response.json();
                adviceDiv.innerHTML = `<strong>👩‍🏫 先生からのアドバイス：</strong><br>${data.candidates[0].content.parts[0].text}`;
            } catch (e) { adviceDiv.innerHTML = "AI先生はお休み中です。"; }
        }
    </script>
